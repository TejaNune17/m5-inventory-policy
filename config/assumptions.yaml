# Every tunable constant used by the pipeline. Justifications live in docs/assumptions.md.
# Code reads from here; there are no hidden constants in src/.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  warehouse: data/warehouse.duckdb
  marts_dir: powerbi/data
  figures_dir: docs/figures

kaggle:
  competition: m5-forecasting-accuracy
  files: [calendar.csv, sales_train_evaluation.csv, sell_prices.csv]

random_seed: 42

dq:
  price_change_threshold: 0.5   # week-over-week relative price change flagged as outlier
  long_zero_run_days: 28        # mid-series zero run at least this long is flagged as possible stockout/delisting

calendar:
  last_day: 1941          # d_1941 = last day in sales_train_evaluation.csv
  horizon_days: 28        # forecast horizon and P2 recompute cadence
  sim_blocks: 13          # simulation window = 13 x 28 = 364 days ending at last_day
  warmup_blocks: 3        # extra LightGBM origins before simulation start, used for P2 error std
  eval_folds: 4           # rolling-origin folds for forecast accuracy, last one ends at last_day
  segment_window_days: 364  # 52 weeks immediately before simulation start

segmentation:
  abc_cutoffs: {A: 0.80, B: 0.95}     # cumulative revenue share; remainder is C
  xyz_cutoffs: {X: 0.5, Y: 1.0}       # CV of weekly units; above Y is Z
  sample_size: 1000

service_level_targets:   # target cycle service level per ABC-XYZ cell (assumed, not measured)
  AX: 0.98
  AY: 0.97
  AZ: 0.95
  BX: 0.96
  BY: 0.95
  BZ: 0.93
  CX: 0.92
  CY: 0.90
  CZ: 0.85

forecast:
  ets_max_zero_share: 0.5        # ETS falls back to 28-day MA when training share of zero days exceeds this
  ets_fit_window_days: 728       # ETS fit on most recent 104 weeks
  lgb_train_window_days: 1092    # LightGBM trained on most recent 156 weeks before each origin
  lgb_params:
    objective: tweedie
    tweedie_variance_power: 1.1
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 0.1
    verbosity: -1
    num_threads: 0
  lgb_num_boost_round: 400

inventory:
  lead_time_days: 7
  lead_time_sd_days: 1
  review_period_days: 1
  unit_cost_share_of_price: 0.70
  annual_holding_rate: 0.25
  order_cost: 20.0
  stockout_mode: lost_sales
  naive_window_days: 90
  p2_error_window_blocks: 3        # P2 sigma_d = std of out-of-sample LightGBM errors over prior 3 blocks
  days_per_year: 365

scenarios:
  service_level_sweep: [0.85, 0.90, 0.925, 0.95, 0.97, 0.98, 0.99, 0.995]
  lead_times: [3, 7, 14]
  lead_time_sds: [0, 1, 3]       # full grid with lead_times: 9 scenarios
